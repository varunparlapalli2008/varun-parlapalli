<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C4A8" />
      <stop offset="50%" stop-color="#AC9062" />
      <stop offset="100%" stop-color="#8C7043" />
    </linearGradient>
    <linearGradient id="pv-burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73102A" />
      <stop offset="100%" stop-color="#590B20" />
    </linearGradient>
  </defs>
  <style>
    .pv-p {
      fill: url(#pv-burgundy);
      stroke: #AC9062;
      stroke-width: 0.6px;
      stroke-linejoin: round;
    }
    .pv-v {
      fill: url(#pv-gold);
    }
    @media (prefers-color-scheme: dark) {
      .pv-p {
        fill: #7E102B;
        stroke: #C5A880;
        stroke-width: 0.8px;
      }
      .pv-v {
        fill: #C5A880;
      }
    }
  </style>
  <g transform="translate(-2, -4)">
    <!-- P Letter - Classical high contrast Bodoni serif with transparent counter -->
    <path
      class="pv-p"
      fill-rule="evenodd"
      d="M 12 10 L 30 10 C 40 10 44 14 44 23 C 44 32 38 36 28 36 L 20 36 L 20 62 L 12 62 Z M 20 16 L 28 16 C 34 16 36 19 36 23 C 36 28 34 30 28 30 L 20 30 Z"
    />
    <!-- Top and bottom serifs on P -->
    <path class="pv-p" d="M 8 10 L 22 10 L 22 12 L 8 12 Z" />
    <path class="pv-p" d="M 8 60 L 24 60 L 24 62 L 8 62 Z" />

    <!-- V Letter - Interlocking gracefully with P in Royal Gold -->
    <path
      class="pv-v"
      d="M 27 24 L 38 62 L 44 62 L 58 24 L 50 24 L 41 53 L 33 24 Z"
    />
    <!-- V left and right top serifs -->
    <path class="pv-v" d="M 24 24 L 35 24 L 35 26 L 24 26 Z" />
    <path class="pv-v" d="M 46 24 L 60 24 L 60 26 L 46 26 Z" />
  </g>
</svg>
